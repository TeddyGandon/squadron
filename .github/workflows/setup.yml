name: Squadron Setup

# Run from the Actions tab after creating a repository from this template. The update workflow
# also runs it after every update. It is idempotent: each run creates missing Squadron labels,
# updates the color and description of existing ones, deletes model labels that are no longer
# listed in .github/squadron-models.txt, and checks that the required secrets work.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create or update labels
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # --force updates the color and description of a label that already exists.
          create() { gh label create "$1" --color "$2" --description "$3" --force; }
          create status:todo        ededed 'Squadron: queued for the coder (one issue at a time)'
          create status:refinement  d4c5f9 'Squadron: the coder is checking the requirements'
          create status:in-progress fbca04 'Squadron: being implemented or fixed'
          create status:review      f29513 'Squadron: the reviewer is checking the pull request'
          create status:testing     1d76db 'Squadron: approved by the reviewer, in testing'
          create status:done        0e8a16 'Squadron: merged'
          create agent:coder        5319e7 'Squadron: queue the coder on this pull request'
          create agent:reviewer     5319e7 'Squadron: queue the reviewer on this pull request'
          create agent:tester       5319e7 'Squadron: queue the tester on this pull request'

          # Every directive:* label shares one color.
          directive_color=d876e3
          create directive:skip-requirements-check "$directive_color" \
            'Squadron: the coder implements the issue without checking its requirements'

          models=()
          while read -r model cost _; do
            label="directive:use-model-$model-cost-$cost"
            create "$label" "$directive_color" "Squadron: agents use $model ($cost cost) for this issue"
            models+=("$label")
          done < <(grep -vE '^[[:space:]]*(#|$)' .github/squadron-models.txt)

          # Delete model labels that are no longer listed, so the labels match the list.
          gh label list --limit 1000 --json name --jq '.[].name' | while IFS= read -r label; do
            if [[ "$label" == directive:use-model-* && " ${models[*]} " != *" $label "* ]]; then
              echo "Deleting obsolete label $label"
              gh label delete "$label" --yes
            fi
          done

      - name: Check secrets
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          SQUADRON_GITHUB_TOKEN: ${{ secrets.SQUADRON_GITHUB_TOKEN }}
        run: |
          failed=0
          if [[ -z "$COPILOT_GITHUB_TOKEN" ]]; then
            echo '::error::Missing repository secret COPILOT_GITHUB_TOKEN.'
            failed=1
          fi
          if [[ -z "$SQUADRON_GITHUB_TOKEN" ]]; then
            echo '::error::Missing repository secret SQUADRON_GITHUB_TOKEN.'
            failed=1
          elif [[ "$(GH_TOKEN="$SQUADRON_GITHUB_TOKEN" gh api "repos/$GITHUB_REPOSITORY" --jq '.permissions.push' 2>/dev/null)" != 'true' ]]; then
            echo '::error::SQUADRON_GITHUB_TOKEN cannot write to this repository. Grant Contents, Pull requests, Issues, and Workflows read and write access.'
            failed=1
          fi
          if ((failed)); then
            exit 1
          fi
          echo 'Squadron is ready: create an issue from one of the issue forms to start.'
