name: Squadron Update

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: product
          token: ${{ secrets.SQUADRON_GITHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: TeddyGandon/squadron
          path: template
          persist-credentials: false

      - name: Configure git
        working-directory: product
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # Update this workflow first. When it changed, commit it and relaunch the
      # new version so the rest of the update runs with the latest file list.
      - name: Update the update workflow
        id: self
        working-directory: product
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow=.github/workflows/update.yml
          if cmp -s "$GITHUB_WORKSPACE/template/$workflow" "$workflow"; then
            echo 'relaunched=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp "$GITHUB_WORKSPACE/template/$workflow" "$workflow"
          git add -- "$workflow"
          git commit -m 'chore: update Squadron update workflow'
          git push origin "HEAD:$GITHUB_REF_NAME"
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo 'relaunched=true' >> "$GITHUB_OUTPUT"
          echo '::notice::The update workflow changed: it was updated and relaunched to finish the update.'

      - name: Copy template files and commit
        if: steps.self.outputs.relaunched != 'true'
        working-directory: product
        run: |
          # Explicit list of the template files to copy. Other files, including
          # other files under .github/, are left untouched.
          files=(
            .github/ISSUE_TEMPLATE/bug.yml
            .github/ISSUE_TEMPLATE/feature.yml
            .github/ISSUE_TEMPLATE/technical-task.yml
            .github/scripts/claim-next-issue.sh
            .github/scripts/extract-requirements-report.py
            .github/scripts/extract-review-report.py
            .github/scripts/install-dependencies.sh
            .github/scripts/read-issue-directives.sh
            .github/scripts/set-agent-label.sh
            .github/scripts/set-issue-status-label.sh
            .github/scripts/start-next-issue.sh
            .github/skills/squadron-requirements-checker/SKILL.md
            .github/skills/squadron-requirements-helper/SKILL.md
            .github/squadron-models.txt
            .github/workflows/coder.yml
            .github/workflows/reviewer.yml
            .github/workflows/setup.yml
            .github/workflows/tester.yml
            .github/workflows/update.yml
            SQUADRON.md
            SQUADRON-CHANGELOG.md
            USAGE.md
          )

          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            cp --preserve=mode "$GITHUB_WORKSPACE/template/$file" "$file"
          done

          git add -- "${files[@]}"
          if git diff --cached --quiet; then
            echo '::notice::The repository already has the latest Squadron template files.'
            exit 0
          fi

          git commit -m 'chore: update Squadron'
          git push origin "HEAD:$GITHUB_REF_NAME"

      # Setup is idempotent, so run it after every update (even with no file changes) to bring
      # the labels in line with the updated template. It runs from the pushed commit.
      - name: Run setup
        if: steps.self.outputs.relaunched != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run setup.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo '::notice::Squadron Setup was started to update the labels and check the secrets.'
